<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JReview</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
        h1 { margin-bottom: 4px; }
        p.subtitle { color: #555; margin-top: 0; }
        .cards { display: flex; flex-wrap: wrap; gap: 16px; }
        .card { flex: 1 1 320px; border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
        textarea { width: 100%; height: 110px; box-sizing: border-box; font-family: ui-monospace, monospace; }
        button { margin-top: 10px; padding: 8px 16px; cursor: pointer; }
        .result { margin-top: 18px; padding: 14px; border-radius: 8px; background: #e8f7e8; }
        .error { margin-top: 18px; padding: 14px; border-radius: 8px; background: #ffe8e8; }
        code { background: #f3f3f3; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>
<h1>JReview</h1>
<p class="subtitle">Classify an e-commerce review as VERIFIED, SPAM, or TOXIC.</p>

<div class="cards">
    <!-- Choice 1: normal typing. No JavaScript needed: this is its own form. -->
    <form class="card" method="post" th:action="@{/moderate}">
        <input type="hidden" name="mode" value="text">
        <h2>Type text</h2>
        <label for="text">Your review</label><br>
        <textarea id="text" name="text" placeholder="Broke after two days. Very disappointed."
                  th:text="${text}">Broke after two days. Very disappointed.</textarea><br>
        <button type="submit">Classify text</button>
    </form>

    <!-- Choice 2: paste the same JSON body the REST API accepts. -->
    <form class="card" method="post" th:action="@{/moderate}">
        <input type="hidden" name="mode" value="json">
        <h2>Paste JSON</h2>
        <label for="json">Request body</label><br>
        <textarea id="json" name="json" placeholder='{"text":"Broke after two days."}'
                  th:text="${json}">{"text":"Broke after two days."}</textarea><br>
        <button type="submit">Classify JSON</button>
    </form>
</div>

<div class="result" th:if="${verdict != null}">
    <strong th:text="${verdict}">VERIFIED</strong>
    <span th:if="${review != null}" th:text="'for: ' + ${review}"></span>
</div>

<div class="error" th:if="${error != null}" th:text="${error}"></div>

<p class="subtitle">
    The REST API is still available at <code>POST /api/v1/reviews/classify</code>.
</p>
</body>
</html>
